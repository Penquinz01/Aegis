<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aegis Node Monitor</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background:#0b1220; color:#e5edf8; }
    * { box-sizing:border-box; }
    body { max-width:1100px; margin:0 auto; padding:28px 20px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:1.7rem; } p { color:#9aabc2; margin:.35rem 0 1.2rem; }
    button { background:#2563eb; color:white; border:0; border-radius:8px; padding:10px 14px; font:inherit; cursor:pointer; }
    button.secondary { background:#263449; } button:disabled { opacity:.55; cursor:default; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; }
    .note { border:1px solid #31435c; border-radius:10px; padding:12px 14px; color:#afc2db; margin:16px 0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    .card,.panel { background:#111c2d; border:1px solid #24344a; border-radius:12px; padding:16px; }
    .card h2 { display:flex; justify-content:space-between; margin:0 0 8px; font-size:1.1rem; }
    .muted { color:#8ea1ba; } .good { color:#55d6a0; } .bad { color:#fb7185; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#64748b; margin-right:6px; }
    .dot.on { background:#34d399; box-shadow:0 0 10px #34d39988; }
    h3 { margin:0 0 10px; font-size:1rem; }
    .panels { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    @media(max-width:700px) { .panels { grid-template-columns:1fr; } }
    .list { max-height:300px; overflow:auto; }
    .row { padding:8px 0; border-bottom:1px solid #24344a; }
    .row:last-child { border:0; } .empty { color:#8ea1ba; padding:10px 0; }
    #events { font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <header>
    <div><h1>Aegis Node Monitor</h1><p>Live ESP-NOW neighbors and bundle activity</p></div>
    <div class="toolbar"><button id="connect">＋ Connect ESP32 serial</button><button id="clear" class="secondary">Clear activity</button></div>
  </header>
  <div class="note" id="support"></div>
  <section class="grid" id="nodes"></section>
  <div class="panels">
    <section class="panel"><h3>Wireless connections</h3><div class="list" id="links"></div></section>
    <section class="panel"><h3>Data sharing</h3><div class="list" id="traffic"></div></section>
  </div>
  <section class="panel" style="margin-top:12px">
    <h3>Send a bundle</h3>
    <form id="sendForm" class="toolbar">
      <label>From <select id="source" required></select></label>
      <label>To <select id="destination" required></select></label>
      <label>Priority <select id="priority"><option>normal</option><option>critical</option><option>bulk</option></select></label>
      <label style="flex:1;min-width:200px">Message <input id="message" required maxlength="180" placeholder="Type a message" style="width:100%;padding:9px;border-radius:7px;border:1px solid #31435c;background:#0b1220;color:inherit"></label>
      <button id="sendButton" type="submit">Send bundle</button>
    </form>
    <div class="muted" id="sendStatus" style="margin-top:8px">Connect a board to enable sending.</div>
  </section>
  <section class="panel" style="margin-top:12px"><h3>Recent serial events</h3><div class="list" id="events"></div></section>
<script>
(() => {
  const nodes = new Map(), links = new Map(), events = [], traffic = [], connections = new Map();
  const nodeBox = document.querySelector('#nodes'), linkBox = document.querySelector('#links');
  const trafficBox = document.querySelector('#traffic'), eventBox = document.querySelector('#events');
  const support = document.querySelector('#support');
  const now = () => Date.now();
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  support.textContent = 'Connect each board once and allow the browser to access its serial port. Use Chrome or Edge on localhost; each USB serial monitor must be closed before connecting here. Nodes are online while their serial stream is alive; radio links expire after 6 seconds without a beacon.';
  function eventLine(line) {
    const fields = Object.fromEntries([...line.matchAll(/(?:^|\s)([a-z_]+)=([^\s]*)/g)].map(m => [m[1], m[2]]));
    if (!fields.event) return;
    const stamp = now();
    if (fields.event === 'boot' || fields.event === 'ready') {
      const id = Number(fields.node);
      if (id) nodes.set(id, {...nodes.get(id), id, lastSeen:stamp, mac:fields.mac || nodes.get(id)?.mac, port:true});
    }
    if (fields.node && nodes.has(Number(fields.node))) nodes.get(Number(fields.node)).lastSeen = stamp;
    if (fields.event === 'neighbor') {
      const from = Number(fields.node), to = Number(fields.peer);
      if (from && to) {
        const key = `${from}-${to}`;
        links.set(key, {from,to,rssi:fields.rssi,cost:fields.cost,lastSeen:stamp});
        if (!nodes.has(from)) nodes.set(from,{id:from,lastSeen:stamp,port:false});
        if (!nodes.has(to)) nodes.set(to,{id:to,lastSeen:stamp,port:false});
      }
    }
    if (['bundle_created','bundle_buffered','bundle_forwarded','bundle_delivered','bundle_acked'].includes(fields.event)) {
      traffic.unshift({time:new Date(stamp).toLocaleTimeString(), event:fields.event, node:fields.node, peer:fields.next || fields.by || '', bundle:fields.bundle || '', payload:fields.payload || ''});
      traffic.splice(50);
    }
    events.unshift(`${new Date(stamp).toLocaleTimeString()} ${line}`); events.splice(80);
    render();
  }
  function render() {
    nodeBox.innerHTML = [...nodes.values()].sort((a,b)=>a.id-b.id).map(n => {
      const online = n.port && now()-n.lastSeen < 8000;
      const outgoing = [...links.values()].filter(l=>l.from===n.id && now()-l.lastSeen<6000).length;
      return `<article class="card"><h2>Node ${n.id}<span class="muted">${n.mac ? esc(n.mac) : ''}</span></h2><div><i class="dot ${online?'on':''}"></i><span class="${online?'good':'muted'}">${online?'Serial connected':'Radio seen'}</span></div><div class="muted">${outgoing} neighbor${outgoing===1?'':'s'} heard</div></article>`;
    }).join('') || '<div class="empty">Connect a board to see nodes.</div>';
    const active = [...links.values()].filter(l=>now()-l.lastSeen<6000).sort((a,b)=>a.from-b.from||a.to-b.to);
    linkBox.innerHTML = active.map(l=>`<div class="row"><span class="good">Node ${l.from} → Node ${l.to}</span><div class="muted">Node ${l.from} hears Node ${l.to} · RSSI ${esc(l.rssi)} dBm · route cost ${esc(l.cost)}</div></div>`).join('') || '<div class="empty">No neighbor beacons yet. Connect boards with Aegis firmware and wait a few seconds.</div>';
    trafficBox.innerHTML = traffic.map(t=>`<div class="row"><strong>${esc(t.event.replace('bundle_','').replaceAll('_',' '))}</strong> · ${esc(t.time)}<div class="muted">Node ${esc(t.node)}${t.peer?` → Node ${esc(t.peer)}`:''} · bundle ${esc(t.bundle)}</div>${t.payload?`<div>${esc(t.payload)}</div>`:''}</div>`).join('') || '<div class="empty">No bundle activity yet. Send a message with: send 5 normal hello</div>';
    eventBox.innerHTML = events.map(esc).join('<br>') || '<div class="empty">Serial events will appear here.</div>';
    const available = [...nodes.values()].filter(n=>n.connection?.write).sort((a,b)=>a.id-b.id);
    const sourceSelect = document.querySelector('#source'), destinationSelect = document.querySelector('#destination');
    const oldSource = sourceSelect.value, oldDestination = destinationSelect.value;
    sourceSelect.innerHTML = available.map(n=>`<option value="${n.id}">Node ${n.id}</option>`).join('');
    destinationSelect.innerHTML = [...nodes.keys()].sort((a,b)=>a-b).map(id=>`<option value="${id}">Node ${id}</option>`).join('');
    if (available.some(n=>String(n.id)===oldSource)) sourceSelect.value=oldSource;
    if ([...nodes.keys()].some(id=>String(id)===oldDestination)) destinationSelect.value=oldDestination;
    document.querySelector('#sendButton').disabled = available.length===0;
    document.querySelector('#sendStatus').textContent = available.length ? 'Choose a connected source node, destination, priority, and message.' : 'Connect a board to enable sending.';
  }
  document.querySelector('#connect').addEventListener('click', async () => {
    if (!('serial' in navigator)) { alert('Web Serial is unavailable. Open this page in Chrome or Edge on localhost.'); return; }
    let port, writer, reader, connection;
    try {
      port = await navigator.serial.requestPort(); await port.open({baudRate:115200});
      writer = port.writable.getWriter();
      connection = {write: text => writer.write(new TextEncoder().encode(text))};
      connections.set(port, connection);
      const decoder = new TextDecoderStream(); const pipe = port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader(); let buffer = '';
      while (true) {
        const {value,done} = await reader.read(); if (done) break;
        buffer += value;
        const lines = buffer.split(/\r?\n/); buffer = lines.pop() || '';
        for (const line of lines) if (line.trim()) {
          const match = line.match(/(?:^|\s)node=(\d+)/);
          if (match) {
            const id=Number(match[1]);
            nodes.set(id,{...nodes.get(id),id,lastSeen:now(),mac:line.match(/\bmac=([^\s]+)/)?.[1]||nodes.get(id)?.mac,port:true,connection});
            render();
          }
          eventLine(line.trim());
        }
      }
      await reader.releaseLock();
    } catch (error) { if (error.name !== 'NotFoundError') alert(`Serial connection error: ${error.message}`); }
    finally {
      if (reader?.releaseLock) { try { reader.releaseLock(); } catch {} }
      if (writer) { try { writer.releaseLock(); } catch {} }
      if (port) {
        connections.delete(port);
        for (const node of nodes.values()) if (node.connection===connection) { node.connection=null; node.port=false; }
        try { await port.close(); } catch {}
      }
      render();
    }
  });
  document.querySelector('#sendForm').addEventListener('submit', async event => {
    event.preventDefault();
    const source=Number(document.querySelector('#source').value), destination=Number(document.querySelector('#destination').value);
    const priority=document.querySelector('#priority').value, message=document.querySelector('#message').value.trim();
    const node=nodes.get(source), status=document.querySelector('#sendStatus');
    if (!node?.connection?.write) { status.textContent='Connect the selected source board first.'; return; }
    if (!message || source===destination) { status.textContent='Choose a different destination and enter a message.'; return; }
    try {
      await node.connection.write(`send ${destination} ${priority} ${message}\n`);
      status.textContent=`Sent command to Node ${source}. Watch Data sharing and Recent serial events for progress.`;
      document.querySelector('#message').value='';
    } catch (error) { status.textContent=`Could not send: ${error.message}`; }
  });
  document.querySelector('#clear').addEventListener('click',()=>{events.length=0;traffic.length=0;render();});
  setInterval(render,1000); render();
})();
</script>
</body>
</html>
