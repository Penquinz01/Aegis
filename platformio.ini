; Five identical ESP32 boards; select the matching environment when flashing.
; Pin pioarduino because the official PlatformIO platform still packages Arduino 2.x.
[platformio]
default_envs = node1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
extra_scripts = post:scripts/xtensa_toolchain.py

[env:node1]
build_flags = ${env.build_flags} -DAEGIS_NODE_ID=1

[env:node2]
build_flags = ${env.build_flags} -DAEGIS_NODE_ID=2

[env:node3]
build_flags = ${env.build_flags} -DAEGIS_NODE_ID=3

[env:node4]
build_flags = ${env.build_flags} -DAEGIS_NODE_ID=4

[env:node5]
build_flags = ${env.build_flags} -DAEGIS_NODE_ID=5
